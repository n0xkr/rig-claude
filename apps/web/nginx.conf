server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Atenção: `add_header` dentro de um `location` descarta os do nível `server`,
    # por isso os cabeçalhos de segurança são repetidos em cada bloco.

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome (Vite): cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker e manifest nunca em cache, senão a PWA não recebe atualizações.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.json|manifest\.webmanifest)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }
}
