name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r exec tsc --noEmit
      - name: Unit/integration tests (API)
        run: pnpm --filter @rigabras/api exec vitest run
      - name: Build
        run: pnpm -r build
      - name: Secret scan
        run: |
          if git grep -nE "(sbp_[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,})" -- . ':!pnpm-lock.yaml' ':!docs'; then
            echo "Possível segredo versionado — DEPLOY BLOCKED"; exit 1
          fi
